<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 680" width="1050" height="680" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="10" y="10" width="1030" height="660" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <rect x="10" y="10" width="1030" height="45" rx="8" fill="#1b2a4a"/>
  <text x="30" y="38" fill="#ffffff" font-size="20" font-weight="bold">AT89S52 UART Serial Interface to USB-to-TTL Serial Bridge</text>
  <text x="860" y="38" fill="#00d2d3" font-size="14" font-weight="bold">CAT6: Week 5 Lab</text>

  <!-- Legend -->
  <rect x="780" y="70" width="240" height="170" rx="6" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="795" y="92" fill="#2c3e50" font-size="13" font-weight="bold">SERIAL COMM LEGEND</text>
  <line x1="795" y1="98" x2="1005" y2="98" stroke="#bdc3c7" stroke-width="1"/>
  <circle cx="805" cy="115" r="5" fill="#2980b9"/>
  <text x="820" y="119" fill="#333" font-size="12">TXD: Transmit Data (Output)</text>
  <circle cx="805" cy="135" r="5" fill="#27ae60"/>
  <text x="820" y="139" fill="#333" font-size="12">RXD: Receive Data (Input)</text>
  <circle cx="805" cy="155" r="5" fill="#2c3e50"/>
  <text x="820" y="159" fill="#333" font-size="12">GND: Common Ground Plane</text>
  <text x="795" y="188" fill="#7f8c8d" font-size="11">Baud Rate: 9600, 8-N-1</text>
  <text x="795" y="208" fill="#7f8c8d" font-size="11">Crystal: 11.0592 MHz (Timer 1)</text>

  <!-- AT89S52 MCU Package Outline (Left) -->
  <rect x="120" y="90" width="280" height="520" rx="6" fill="#f4f6f9" stroke="#2c3e50" stroke-width="2.5"/>
  <path d="M 240 90 A 20 20 0 0 1 280 90 Z" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <text x="260" y="125" text-anchor="middle" fill="#2c3e50" font-size="18" font-weight="bold">AT89S52</text>
  <text x="260" y="145" text-anchor="middle" fill="#7f8c8d" font-size="12">DIP-40 Package</text>

  <!-- Left Side Pins (Clock & Reset) -->
  <line x1="60" y1="200" x2="120" y2="200" stroke="#e67e22" stroke-width="2"/>
  <text x="130" y="205" fill="#2c3e50" font-size="12" font-weight="bold">Pin 9: RST</text>
  
  <line x1="60" y1="320" x2="120" y2="320" stroke="#2980b9" stroke-width="2"/>
  <text x="130" y="325" fill="#2c3e50" font-size="12" font-weight="bold">Pin 18: XTAL2</text>
  
  <line x1="60" y1="360" x2="120" y2="360" stroke="#2980b9" stroke-width="2"/>
  <text x="130" y="365" fill="#2c3e50" font-size="12" font-weight="bold">Pin 19: XTAL1</text>
  
  <line x1="60" y1="520" x2="120" y2="520" stroke="#2c3e50" stroke-width="3"/>
  <text x="130" y="525" fill="#2c3e50" font-size="12" font-weight="bold">Pin 20: GND</text>

  <!-- Right Side Pins (UART & Power) -->
  <line x1="400" y1="130" x2="460" y2="130" stroke="#e74c3c" stroke-width="3"/>
  <text x="320" y="135" fill="#2c3e50" font-size="12" font-weight="bold">Pin 40: VCC</text>

  <!-- Pin 11: P3.1 / TXD -->
  <line x1="400" y1="260" x2="560" y2="260" stroke="#2980b9" stroke-width="3"/>
  <text x="300" y="265" fill="#2980b9" font-size="12" font-weight="bold">Pin 11: P3.1 (TXD)</text>

  <!-- Pin 10: P3.0 / RXD -->
  <line x1="400" y1="340" x2="560" y2="340" stroke="#27ae60" stroke-width="3"/>
  <text x="300" y="345" fill="#27ae60" font-size="12" font-weight="bold">Pin 10: P3.0 (RXD)</text>

  <!-- Common GND connection wire -->
  <line x1="60" y1="520" x2="60" y2="580" stroke="#2c3e50" stroke-width="3"/>
  <line x1="60" y1="580" x2="680" y2="580" stroke="#2c3e50" stroke-width="3"/>
  <line x1="680" y1="580" x2="680" y2="420" stroke="#2c3e50" stroke-width="3"/>

  <!-- Cross-wiring Lines between MCU and USB-to-TTL Adapter -->
  <!-- MCU TXD (P3.1) -> Adapter RXD -->
  <line x1="560" y1="260" x2="640" y2="340" stroke="#2980b9" stroke-width="3"/>
  <line x1="640" y1="340" x2="680" y2="340" stroke="#2980b9" stroke-width="3"/>
  
  <!-- MCU RXD (P3.0) <- Adapter TXD -->
  <line x1="560" y1="340" x2="640" y2="260" stroke="#27ae60" stroke-width="3"/>
  <line x1="640" y1="260" x2="680" y2="260" stroke="#27ae60" stroke-width="3"/>

  <!-- USB-to-TTL Serial Adapter Module (Middle Right) -->
  <g transform="translate(680, 200)">
    <rect x="0" y="0" width="180" height="260" rx="6" fill="#fffaf0" stroke="#e67e22" stroke-width="2"/>
    <text x="15" y="28" fill="#d35400" font-size="13" font-weight="bold">USB-to-TTL Module</text>
    <text x="25" y="48" fill="#7f8c8d" font-size="10">(CH340G / CP2102 / FTDI)</text>

    <!-- Adapter Pins -->
    <circle cx="0" cy="60" r="4" fill="#27ae60"/>
    <text x="15" y="65" fill="#27ae60" font-size="12" font-weight="bold">TXD Pin</text>
    <text x="80" y="65" fill="#555" font-size="10">(To MCU RXD)</text>

    <circle cx="0" cy="140" r="4" fill="#2980b9"/>
    <text x="15" y="145" fill="#2980b9" font-size="12" font-weight="bold">RXD Pin</text>
    <text x="80" y="145" fill="#555" font-size="10">(From MCU TXD)</text>

    <circle cx="0" cy="220" r="4" fill="#2c3e50"/>
    <text x="15" y="225" fill="#2c3e50" font-size="12" font-weight="bold">GND Pin</text>
    <text x="80" y="225" fill="#555" font-size="10">(Common Ground)</text>

    <!-- USB Type-A Plug Outline -->
    <rect x="180" y="100" width="50" height="60" rx="3" fill="#ecf0f1" stroke="#7f8c8d" stroke-width="1.5"/>
    <text x="185" y="135" fill="#2c3e50" font-size="10" font-weight="bold">USB</text>
  </g>

  <!-- Host PC Terminal Block (Far Right) -->
  <g transform="translate(930, 280)">
    <rect x="0" y="0" width="100" height="100" rx="6" fill="#1e272e" stroke="#00d2d3" stroke-width="2"/>
    <text x="20" y="35" fill="#00d2d3" font-size="12" font-weight="bold">PuTTY</text>
    <text x="10" y="55" fill="#ffffff" font-size="9">Terminal PC</text>
    <text x="10" y="75" fill="#ffffff" font-size="9">9600-8-N-1</text>
    <text x="10" y="90" fill="#2ecc71" font-size="9">&gt; ABC123</text>
  </g>

  <!-- USB Cable Link -->
  <line x1="910" y1="330" x2="930" y2="330" stroke="#00d2d3" stroke-width="4"/>

  <!-- Footer -->
  <rect x="30" y="615" width="990" height="50" rx="4" fill="#eef2f7" stroke="#2c3e50" stroke-width="1"/>
  <text x="45" y="635" fill="#1b2a4a" font-size="11" font-weight="bold">CROSS-WIRING PRINCIPLE: MCU TXD (Pin 11) -> Bridge RXD | MCU RXD (Pin 10) &lt;- Bridge TXD | Common GND (Pin 20)</text>
  <text x="45" y="652" fill="#555" font-size="10">Timer 1 Mode 2 Auto-Reload: TH1 = 0xFD (9600 Baud with SMOD=0 @ 11.0592 MHz crystal, 0.0% Baud Error)</text>
</svg>
