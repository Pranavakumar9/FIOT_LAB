<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="10" y="10" width="980" height="680" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <rect x="10" y="10" width="980" height="45" rx="8" fill="#1b2a4a"/>
  <text x="30" y="38" fill="#ffffff" font-size="20" font-weight="bold">AT89S52 4-Mode LED Pattern Generator &amp; INT0 Button Controller</text>
  <text x="820" y="38" fill="#00d2d3" font-size="14" font-weight="bold">CAT3: Week 2 Lab</text>

  <!-- Legend Box -->
  <rect x="730" y="70" width="240" height="180" rx="6" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="745" y="92" fill="#2c3e50" font-size="13" font-weight="bold">CIRCUIT LEGEND</text>
  <line x1="745" y1="98" x2="955" y2="98" stroke="#bdc3c7" stroke-width="1"/>
  <circle cx="755" cy="115" r="5" fill="#e74c3c"/>
  <text x="770" y="119" fill="#333" font-size="12">VCC (+5.0V Power)</text>
  <circle cx="755" cy="135" r="5" fill="#2c3e50"/>
  <text x="770" y="139" fill="#333" font-size="12">GND (Common Return)</text>
  <circle cx="755" cy="155" r="5" fill="#27ae60"/>
  <text x="770" y="159" fill="#333" font-size="12">4x Active-LOW LEDs (P2.0-P2.3)</text>
  <circle cx="755" cy="175" r="5" fill="#e67e22"/>
  <text x="770" y="179" fill="#333" font-size="12">Push-Button Switch (P3.2 / INT0)</text>
  <circle cx="755" cy="195" r="5" fill="#2980b9"/>
  <text x="770" y="199" fill="#333" font-size="12">11.0592 MHz Crystal / Reset</text>
  <text x="745" y="230" fill="#7f8c8d" font-size="10" font-style="italic">Assumed: P2.0-P2.3 for LEDs, P3.2 for Button</text>

  <!-- MCU Package Outline (DIP-40) -->
  <rect x="330" y="80" width="280" height="580" rx="6" fill="#f4f6f9" stroke="#2c3e50" stroke-width="2.5"/>
  <path d="M 450 80 A 20 20 0 0 1 490 80 Z" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <text x="470" y="115" text-anchor="middle" fill="#2c3e50" font-size="18" font-weight="bold">AT89S52</text>
  <text x="470" y="135" text-anchor="middle" fill="#7f8c8d" font-size="12">DIP-40 Package</text>

  <!-- Left Pins -->
  <!-- Pin 9: RST -->
  <line x1="270" y1="180" x2="330" y2="180" stroke="#e67e22" stroke-width="2"/>
  <text x="340" y="185" fill="#2c3e50" font-size="12" font-weight="bold">9 (RST)</text>
  <!-- Pin 12: P3.2 / INT0 -->
  <line x1="200" y1="240" x2="330" y2="240" stroke="#e67e22" stroke-width="2.5"/>
  <text x="340" y="245" fill="#d35400" font-size="12" font-weight="bold">12 (P3.2 / /INT0)</text>
  <!-- Pin 18, 19: XTAL2, XTAL1 -->
  <line x1="270" y1="360" x2="330" y2="360" stroke="#2980b9" stroke-width="2"/>
  <text x="340" y="365" fill="#2c3e50" font-size="12" font-weight="bold">18 (XTAL2)</text>
  <line x1="270" y1="400" x2="330" y2="400" stroke="#2980b9" stroke-width="2"/>
  <text x="340" y="405" fill="#2c3e50" font-size="12" font-weight="bold">19 (XTAL1)</text>
  <!-- Pin 20: GND -->
  <line x1="270" y1="620" x2="330" y2="620" stroke="#2c3e50" stroke-width="3"/>
  <text x="340" y="625" fill="#2c3e50" font-size="12" font-weight="bold">20 (GND)</text>

  <!-- Right Pins -->
  <!-- Pin 40: VCC -->
  <line x1="610" y1="120" x2="670" y2="120" stroke="#e74c3c" stroke-width="3"/>
  <text x="545" y="125" fill="#2c3e50" font-size="12" font-weight="bold">40 (VCC)</text>
  <!-- Pin 31: EA/VPP -->
  <line x1="610" y1="160" x2="670" y2="160" stroke="#e74c3c" stroke-width="2"/>
  <text x="525" y="165" fill="#2c3e50" font-size="12" font-weight="bold">31 (EA/VPP)</text>

  <!-- Port 2 LED Pins (Right) -->
  <!-- P2.0 (Pin 21) -->
  <line x1="610" y1="300" x2="680" y2="300" stroke="#27ae60" stroke-width="2.5"/>
  <text x="550" y="305" fill="#2c3e50" font-size="12" font-weight="bold">21 (P2.0)</text>
  <!-- P2.1 (Pin 22) -->
  <line x1="610" y1="340" x2="680" y2="340" stroke="#27ae60" stroke-width="2.5"/>
  <text x="550" y="345" fill="#2c3e50" font-size="12" font-weight="bold">22 (P2.1)</text>
  <!-- P2.2 (Pin 23) -->
  <line x1="610" y1="380" x2="680" y2="380" stroke="#27ae60" stroke-width="2.5"/>
  <text x="550" y="385" fill="#2c3e50" font-size="12" font-weight="bold">23 (P2.2)</text>
  <!-- P2.3 (Pin 24) -->
  <line x1="610" y1="420" x2="680" y2="420" stroke="#27ae60" stroke-width="2.5"/>
  <text x="550" y="425" fill="#2c3e50" font-size="12" font-weight="bold">24 (P2.3)</text>

  <!-- Push Button Switch Circuit (Left) -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="140" height="100" rx="4" fill="#fffaf0" stroke="#e67e22" stroke-width="1.5"/>
    <text x="10" y="20" fill="#d35400" font-size="11" font-weight="bold">Mode Step Switch</text>
    <circle cx="20" cy="40" r="4" fill="#2c3e50"/>
    <line x1="20" y1="40" x2="60" y2="30" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="80" cy="40" r="4" fill="#2c3e50"/>
    <line x1="80" y1="40" x2="140" y2="40" stroke="#e67e22" stroke-width="2"/>
    <!-- Pull-up 10k resistor to +5V -->
    <rect x="72" y="55" width="16" height="30" fill="#f1c40f" stroke="#d35400" stroke-width="1"/>
    <text x="92" y="73" fill="#333" font-size="9">10 kΩ</text>
    <line x1="80" y1="40" x2="80" y2="55" stroke="#2c3e50" stroke-width="1.5"/>
    <line x1="80" y1="85" x2="80" y2="95" stroke="#e74c3c" stroke-width="1.5"/>
    <circle cx="80" cy="95" r="3" fill="#e74c3c"/>
    <text x="90" y="98" fill="#e74c3c" font-size="10" font-weight="bold">+5V</text>
    <!-- Ground connection -->
    <line x1="20" y1="40" x2="20" y2="70" stroke="#2c3e50" stroke-width="2"/>
    <line x1="10" y1="70" x2="30" y2="70" stroke="#2c3e50" stroke-width="2"/>
    <text x="8" y="88" fill="#2c3e50" font-size="9">GND</text>
  </g>

  <!-- 4-LED Array Box (Right) -->
  <g transform="translate(680, 260)">
    <rect x="0" y="0" width="300" height="200" rx="6" fill="#fcfcfc" stroke="#27ae60" stroke-width="1.5"/>
    <text x="15" y="24" fill="#27ae60" font-size="12" font-weight="bold">4-Channel Active-LOW LED Array</text>
    
    <!-- LED1 (P2.0) -->
    <line x1="0" y1="40" x2="40" y2="40" stroke="#27ae60" stroke-width="2"/>
    <path d="M 40 30 L 40 50 L 60 40 Z" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
    <line x1="60" y1="30" x2="60" y2="50" stroke="#27ae60" stroke-width="1.5"/>
    <line x1="60" y1="40" x2="85" y2="40" stroke="#27ae60" stroke-width="1.5"/>
    <rect x="85" y="34" width="45" height="12" fill="#f1c40f" stroke="#d35400" stroke-width="1"/>
    <text x="90" y="44" fill="#333" font-size="9">330Ω</text>
    <line x1="130" y1="40" x2="160" y2="40" stroke="#e74c3c" stroke-width="2"/>
    <text x="175" y="44" fill="#2c3e50" font-size="11">LED 1 (Bit 0)</text>

    <!-- LED2 (P2.1) -->
    <line x1="0" y1="80" x2="40" y2="80" stroke="#27ae60" stroke-width="2"/>
    <path d="M 40 70 L 40 90 L 60 80 Z" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
    <line x1="60" y1="70" x2="60" y2="90" stroke="#27ae60" stroke-width="1.5"/>
    <line x1="60" y1="80" x2="85" y2="80" stroke="#27ae60" stroke-width="1.5"/>
    <rect x="85" y="74" width="45" height="12" fill="#f1c40f" stroke="#d35400" stroke-width="1"/>
    <text x="90" y="84" fill="#333" font-size="9">330Ω</text>
    <line x1="130" y1="80" x2="160" y2="80" stroke="#e74c3c" stroke-width="2"/>
    <text x="175" y="84" fill="#2c3e50" font-size="11">LED 2 (Bit 1)</text>

    <!-- LED3 (P2.2) -->
    <line x1="0" y1="120" x2="40" y2="120" stroke="#27ae60" stroke-width="2"/>
    <path d="M 40 110 L 40 130 L 60 120 Z" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
    <line x1="60" y1="110" x2="60" y2="130" stroke="#27ae60" stroke-width="1.5"/>
    <line x1="60" y1="120" x2="85" y2="120" stroke="#27ae60" stroke-width="1.5"/>
    <rect x="85" y="114" width="45" height="12" fill="#f1c40f" stroke="#d35400" stroke-width="1"/>
    <text x="90" y="124" fill="#333" font-size="9">330Ω</text>
    <line x1="130" y1="120" x2="160" y2="120" stroke="#e74c3c" stroke-width="2"/>
    <text x="175" y="124" fill="#2c3e50" font-size="11">LED 3 (Bit 2)</text>

    <!-- LED4 (P2.3) -->
    <line x1="0" y1="160" x2="40" y2="160" stroke="#27ae60" stroke-width="2"/>
    <path d="M 40 150 L 40 170 L 60 160 Z" fill="#2ecc71" stroke="#27ae60" stroke-width="1.5"/>
    <line x1="60" y1="150" x2="60" y2="170" stroke="#27ae60" stroke-width="1.5"/>
    <line x1="60" y1="160" x2="85" y2="160" stroke="#27ae60" stroke-width="1.5"/>
    <rect x="85" y="154" width="45" height="12" fill="#f1c40f" stroke="#d35400" stroke-width="1"/>
    <text x="90" y="164" fill="#333" font-size="9">330Ω</text>
    <line x1="130" y1="160" x2="160" y2="160" stroke="#e74c3c" stroke-width="2"/>
    <text x="175" y="164" fill="#2c3e50" font-size="11">LED 4 (Bit 3)</text>

    <!-- Common VCC rail for all 4 LEDs -->
    <line x1="160" y1="40" x2="160" y2="160" stroke="#e74c3c" stroke-width="2"/>
    <line x1="160" y1="100" x2="260" y2="100" stroke="#e74c3c" stroke-width="2"/>
    <circle cx="260" cy="100" r="4" fill="#e74c3c"/>
    <text x="268" y="104" fill="#e74c3c" font-size="11" font-weight="bold">+5V</text>
  </g>

  <!-- State Flow Summary Box -->
  <rect x="330" y="580" width="630" height="80" rx="4" fill="#eef2f7" stroke="#2c3e50" stroke-width="1"/>
  <text x="345" y="605" fill="#1b2a4a" font-size="12" font-weight="bold">FSM OPERATING MODES:</text>
  <text x="345" y="625" fill="#333" font-size="11">Press 1 -> Mode 1: Running Chaser (LED1->LED2->LED3->LED4)</text>
  <text x="345" y="645" fill="#333" font-size="11">Press 2 -> Mode 2: 4-Bit Binary Counter (0000 to 1111) | Press 3 -> Mode 3: Alternating (1010/0101) | Press 4 -> Mode 4: All Flash (1111/0000)</text>
</svg>
