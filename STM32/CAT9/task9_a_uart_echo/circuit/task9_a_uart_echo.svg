<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="10" y="10" width="980" height="580" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <rect x="10" y="10" width="980" height="45" rx="8" fill="#1b2a4a"/>
  <text x="25" y="38" fill="#ffffff" font-size="18" font-weight="bold">Task 9A: USART1 Bidirectional Character Echo Loop</text>
  <text x="820" y="38" fill="#00d2d3" font-size="13" font-weight="bold">STM32F103 Blue Pill</text>

  <!-- PC Terminal Box -->
  <g transform="translate(60, 120)">
    <rect x="0" y="0" width="260" height="260" rx="6" fill="#1a252f" stroke="#34495e" stroke-width="2"/>
    <text x="20" y="30" fill="#00d2d3" font-size="14" font-weight="bold">Serial Terminal Host</text>
    <rect x="15" y="45" width="230" height="190" fill="#000000"/>
    <text x="25" y="75" fill="#2ecc71" font-family="monospace" font-size="12">Key Pressed: 'A'</text>
    <text x="25" y="105" fill="#3498db" font-family="monospace" font-size="12">Transmitting 'A' ...</text>
    <text x="25" y="135" fill="#f1c40f" font-family="monospace" font-size="12">Echo Received: 'A'</text>
    <text x="25" y="165" fill="#ffffff" font-family="monospace" font-size="11">Terminal Displays: A</text>
    <text x="25" y="210" fill="#95a5a6" font-size="10">Full-duplex verification</text>
  </g>

  <!-- MCU USART1 Processing Box -->
  <g transform="translate(540, 100)">
    <rect x="0" y="0" width="400" height="300" rx="8" fill="#0f2b46" stroke="#1abc9c" stroke-width="2"/>
    <text x="30" y="35" fill="#1abc9c" font-size="16" font-weight="bold">STM32 USART1 Peripheral Engine</text>

    <!-- RX Buffer Stage -->
    <rect x="25" y="60" width="350" height="60" rx="4" fill="#1c2833" stroke="#27ae60" stroke-width="1.5"/>
    <text x="35" y="85" fill="#2ecc71" font-size="12" font-weight="bold">1. HAL_UART_Receive(&amp;huart1, &amp;ch, 1, TIMEOUT)</text>
    <text x="35" y="105" fill="#bdc3c7" font-size="11">Samples incoming bitstream from PA10 (RX)</text>

    <!-- Echo Transmission Stage -->
    <rect x="25" y="150" width="350" height="60" rx="4" fill="#1c2833" stroke="#f39c12" stroke-width="1.5"/>
    <text x="35" y="175" fill="#f39c12" font-size="12" font-weight="bold">2. HAL_UART_Transmit(&amp;huart1, &amp;ch, 1, TIMEOUT)</text>
    <text x="35" y="195" fill="#bdc3c7" font-size="11">Re-transmits identical byte back out on PA9 (TX)</text>

    <!-- Status -->
    <text x="35" y="245" fill="#ecf0f1" font-size="12">• Baud: 9600 bps | 8 data bits | 1 stop bit</text>
    <text x="35" y="270" fill="#ecf0f1" font-size="12">• Confirms physical link integrity &amp; clock accuracy</text>
  </g>

  <!-- TX/RX Arrows -->
  <path d="M 320 200 L 540 200" fill="none" stroke="#27ae60" stroke-width="3"/>
  <polygon points="530,195 540,200 530,205" fill="#27ae60"/>
  <text x="380" y="190" fill="#27ae60" font-size="11" font-weight="bold">Host TX -&gt; STM32 PA10 (RX)</text>

  <path d="M 540 280 L 320 280" fill="none" stroke="#f39c12" stroke-width="3"/>
  <polygon points="330,275 320,280 330,285" fill="#f39c12"/>
  <text x="380" y="270" fill="#f39c12" font-size="11" font-weight="bold">STM32 PA9 (TX) -&gt; Host RX</text>

  <!-- Timing Chart below -->
  <g transform="translate(60, 430)">
    <rect x="0" y="0" width="880" height="120" rx="6" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1.5"/>
    <text x="20" y="25" fill="#2c3e50" font-size="13" font-weight="bold">UART FRAME FORMAT (9600-8-N-1): 1 Start bit, 8 Data bits (LSB first), 1 Stop bit</text>
    <path d="M 50 60 L 120 60 L 120 95 L 180 95 L 180 60 L 240 60 L 240 95 L 300 95 L 300 60 L 360 60 L 360 95 L 420 95 L 420 60 L 480 60 L 480 95 L 540 95 L 540 60 L 600 60 L 600 60 L 700 60" fill="none" stroke="#2c3e50" stroke-width="2"/>
    <text x="135" y="85" fill="#e74c3c" font-size="10" font-weight="bold">START</text>
    <text x="200" y="50" fill="#2980b9" font-size="10">D0</text>
    <text x="260" y="85" fill="#2980b9" font-size="10">D1</text>
    <text x="320" y="50" fill="#2980b9" font-size="10">D2</text>
    <text x="380" y="85" fill="#2980b9" font-size="10">D3</text>
    <text x="440" y="50" fill="#2980b9" font-size="10">D4</text>
    <text x="500" y="85" fill="#2980b9" font-size="10">D5</text>
    <text x="560" y="50" fill="#2980b9" font-size="10">D6</text>
    <text x="615" y="50" fill="#2980b9" font-size="10">D7</text>
    <text x="640" y="50" fill="#27ae60" font-size="10" font-weight="bold">STOP</text>
  </g>
</svg>