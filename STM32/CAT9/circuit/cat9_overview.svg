<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" width="1150" height="780" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="10" y="10" width="1130" height="760" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <rect x="10" y="10" width="1130" height="48" rx="8" fill="#1b2a4a"/>
  <text x="30" y="38" fill="#ffffff" font-size="20" font-weight="bold">STM32F103 (Blue Pill) USART1 &amp; USB-to-UART Host Interface</text>
  <text x="960" y="38" fill="#00d2d3" font-size="14" font-weight="bold">CAT9: Week 9 Lab</text>

  <!-- Legend -->
  <rect x="870" y="75" width="250" height="210" rx="6" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="885" y="98" fill="#2c3e50" font-size="13" font-weight="bold">CIRCUIT PIN CONNECTIONS</text>
  <line x1="885" y1="104" x2="1105" y2="104" stroke="#bdc3c7" stroke-width="1"/>
  <circle cx="895" cy="122" r="5" fill="#f39c12"/>
  <text x="910" y="126" fill="#333" font-size="12">PA9: USART1_TX (To Adapter RX)</text>
  <circle cx="895" cy="144" r="5" fill="#27ae60"/>
  <text x="910" y="148" fill="#333" font-size="12">PA10: USART1_RX (From Adapter TX)</text>
  <circle cx="895" cy="166" r="5" fill="#2c3e50"/>
  <text x="910" y="170" fill="#333" font-size="12">GND: Common Ground Connection</text>
  <circle cx="895" cy="188" r="5" fill="#2980b9"/>
  <text x="910" y="192" fill="#333" font-size="12">PC13: Active-LOW Status LED</text>
  <text x="885" y="222" fill="#7f8c8d" font-size="11" font-style="italic">Baud Rate: 9600-8-N-1</text>
  <text x="885" y="238" fill="#7f8c8d" font-size="11" font-style="italic">Logic Levels: 3.3V CMOS UART</text>
  <text x="885" y="254" fill="#7f8c8d" font-size="11" font-style="italic">Do NOT connect 5V to PA9/PA10</text>

  <!-- PC / Host Machine (Left) -->
  <g transform="translate(40, 100)">
    <rect x="0" y="0" width="220" height="300" rx="8" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
    <rect x="15" y="20" width="190" height="150" rx="4" fill="#1a252f"/>
    <!-- Terminal window mockup -->
    <rect x="25" y="30" width="170" height="130" fill="#000000"/>
    <text x="35" y="50" fill="#00ff00" font-family="monospace" font-size="10">&gt; LED ON</text>
    <text x="35" y="68" fill="#ffffff" font-family="monospace" font-size="10">[OK] LED is ON</text>
    <text x="35" y="86" fill="#00ff00" font-family="monospace" font-size="10">&gt; STATUS</text>
    <text x="35" y="104" fill="#ffffff" font-family="monospace" font-size="10">[STATE] ON</text>
    <text x="35" y="122" fill="#00ff00" font-family="monospace" font-size="10">&gt; _</text>

    <text x="30" y="205" fill="#ffffff" font-size="14" font-weight="bold">Host PC / Serial Terminal</text>
    <text x="30" y="230" fill="#bdc3c7" font-size="12">PuTTY / Tera Term</text>
    <text x="30" y="250" fill="#00d2d3" font-size="11">COMx @ 9600 8-N-1</text>
  </g>

  <!-- USB to UART Bridge Module (Middle) -->
  <g transform="translate(320, 140)">
    <rect x="0" y="0" width="180" height="220" rx="6" fill="#ebedef" stroke="#7f8c8d" stroke-width="2"/>
    <text x="15" y="30" fill="#2c3e50" font-size="13" font-weight="bold">USB-to-TTL Module</text>
    <text x="15" y="48" fill="#7f8c8d" font-size="11">(CP2102 / CH340)</text>

    <!-- Pins on right -->
    <circle cx="165" cy="80" r="5" fill="#f39c12"/>
    <text x="150" y="84" fill="#333" font-size="11" text-anchor="end">RXD</text>

    <circle cx="165" cy="120" r="5" fill="#27ae60"/>
    <text x="150" y="124" fill="#333" font-size="11" text-anchor="end">TXD</text>

    <circle cx="165" cy="160" r="5" fill="#2c3e50"/>
    <text x="150" y="164" fill="#333" font-size="11" text-anchor="end">GND</text>

    <circle cx="165" cy="200" r="5" fill="#e74c3c"/>
    <text x="150" y="204" fill="#e74c3c" font-size="11" text-anchor="end">3.3V</text>
  </g>

  <!-- USB Cable Link (PC to Adapter) -->
  <line x1="260" y1="250" x2="320" y2="250" stroke="#34495e" stroke-width="6"/>
  <text x="270" y="240" fill="#7f8c8d" font-size="10">USB</text>

  <!-- STM32 Blue Pill Board (Right) -->
  <g transform="translate(580, 80)">
    <rect x="0" y="0" width="260" height="640" rx="8" fill="#0f2b46" stroke="#1abc9c" stroke-width="2.5"/>
    <text x="45" y="35" fill="#1abc9c" font-size="18" font-weight="bold">STM32F103C8T6</text>
    <text x="50" y="58" fill="#bdc3c7" font-size="12">Blue Pill (72 MHz)</text>

    <!-- MCU Pinout Representation -->
    <g transform="translate(15, 80)">
      <circle cx="10" cy="100" r="6" fill="#f39c12"/>
      <text x="25" y="104" fill="#f39c12" font-size="12" font-weight="bold">PA9 (USART1_TX)</text>

      <circle cx="10" cy="140" r="6" fill="#27ae60"/>
      <text x="25" y="144" fill="#27ae60" font-size="12" font-weight="bold">PA10 (USART1_RX)</text>

      <circle cx="10" cy="180" r="6" fill="#2c3e50"/>
      <text x="25" y="184" fill="#ecf0f1" font-size="12">GND (Ground)</text>

      <circle cx="10" cy="220" r="6" fill="#e74c3c"/>
      <text x="25" y="224" fill="#e74c3c" font-size="12">3.3V (VDD)</text>

      <circle cx="10" cy="300" r="6" fill="#2980b9"/>
      <text x="25" y="304" fill="#00d2d3" font-size="12" font-weight="bold">PC13 (User LED)</text>
    </g>
  </g>

  <!-- Crossing UART Lines -->
  <!-- PA9 TX to Adapter RX -->
  <path d="M 595 180 L 540 180 L 540 220 L 485 220" fill="none" stroke="#f39c12" stroke-width="2.5"/>
  <text x="510" y="210" fill="#f39c12" font-size="10" font-weight="bold">TX -&gt; RX</text>

  <!-- Adapter TX to PA10 RX -->
  <path d="M 485 260 L 540 260 L 540 220 L 595 220" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="510" y="275" fill="#27ae60" font-size="10" font-weight="bold">TX &lt;- RX</text>

  <!-- GND Line -->
  <line x1="485" y1="300" x2="595" y2="260" stroke="#2c3e50" stroke-width="2"/>

  <!-- PC13 LED Box -->
  <g transform="translate(870, 380)">
    <rect x="0" y="0" width="250" height="180" rx="6" fill="#fcf3cf" stroke="#f39c12" stroke-width="2"/>
    <text x="20" y="30" fill="#d35400" font-size="14" font-weight="bold">PC13 User LED</text>
    <text x="20" y="50" fill="#7f8c8d" font-size="11">Active-LOW Hardware</text>
    <text x="20" y="90" fill="#2c3e50" font-size="11">&gt; "LED ON"  -&gt; Drives PC13 LOW</text>
    <text x="20" y="115" fill="#2c3e50" font-size="11">&gt; "LED OFF" -&gt; Drives PC13 HIGH</text>
    <text x="20" y="140" fill="#2c3e50" font-size="11">&gt; "LED TOGGLE" -&gt; Inverts PC13</text>
  </g>
  <line x1="775" y1="380" x2="870" y2="440" stroke="#2980b9" stroke-width="2"/>
</svg>