<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="10" y="10" width="980" height="600" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <rect x="10" y="10" width="980" height="45" rx="8" fill="#1b2a4a"/>
  <text x="25" y="38" fill="#ffffff" font-size="18" font-weight="bold">Task 9B: String Command Parser &amp; LED Controller Architecture</text>
  <text x="820" y="38" fill="#00d2d3" font-size="13" font-weight="bold">STM32F103 Blue Pill</text>

  <!-- Ingestion Pipeline -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="900" height="240" rx="6" fill="#f8f9fa" stroke="#2980b9" stroke-width="1.5"/>
    <text x="25" y="28" fill="#2980b9" font-size="14" font-weight="bold">COMMAND INGESTION &amp; TOKENIZATION PIPELINE</text>

    <!-- Stage 1: Byte Stream -->
    <rect x="30" y="55" width="180" height="80" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="45" y="80" fill="#2c3e50" font-size="12" font-weight="bold">1. Serial Ingestion</text>
    <text x="45" y="100" fill="#7f8c8d" font-size="10">Read byte from USART1</text>
    <text x="45" y="118" fill="#2980b9" font-size="10">Echo character to Host</text>

    <line x1="210" y1="95" x2="250" y2="95" stroke="#2c3e50" stroke-width="2"/>

    <!-- Stage 2: Line Buffer -->
    <rect x="250" y="55" width="200" height="80" rx="6" fill="#ffffff" stroke="#f39c12" stroke-width="1.5"/>
    <text x="265" y="80" fill="#d35400" font-size="12" font-weight="bold">2. Line Accumulator</text>
    <text x="265" y="100" fill="#7f8c8d" font-size="10">Buffer up to 64 chars</text>
    <text x="265" y="118" fill="#d35400" font-size="10">Handle Backspace ()</text>

    <line x1="450" y1="95" x2="490" y2="95" stroke="#2c3e50" stroke-width="2"/>

    <!-- Stage 3: Delimiter -->
    <rect x="490" y="55" width="180" height="80" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5"/>
    <text x="505" y="80" fill="#8e44ad" font-size="12" font-weight="bold">3. Delimiter Lock</text>
    <text x="505" y="100" fill="#7f8c8d" font-size="10">Detect '' or '
'</text>
    <text x="505" y="118" fill="#8e44ad" font-size="10">Append null-terminator</text>

    <line x1="670" y1="95" x2="710" y2="95" stroke="#2c3e50" stroke-width="2"/>

    <!-- Stage 4: Normalizer -->
    <rect x="710" y="55" width="160" height="80" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
    <text x="725" y="80" fill="#27ae60" font-size="12" font-weight="bold">4. Normalization</text>
    <text x="725" y="100" fill="#7f8c8d" font-size="10">Trim whitespace</text>
    <text x="725" y="118" fill="#27ae60" font-size="10">Convert to UPPERCASE</text>

    <text x="30" y="165" fill="#34495e" font-size="11">• Full error protection against buffer overrun (clamps at 63 characters).</text>
    <text x="30" y="185" fill="#34495e" font-size="11">• Seamless carriage-return () and newline (
) handling across all OS terminals.</text>
  </g>

  <!-- Execution & Dispatcher -->
  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="900" height="250" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="2"/>
    <text x="25" y="28" fill="#2980b9" font-size="14" font-weight="bold">COMMAND DISPATCHER &amp; ACTUATION TABLE</text>

    <!-- Command 1 -->
    <rect x="30" y="50" width="260" height="85" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
    <text x="45" y="75" fill="#27ae60" font-size="13" font-weight="bold">"LED ON"</text>
    <text x="45" y="95" fill="#2c3e50" font-size="11">PC13 = RESET (Active-LOW)</text>
    <text x="45" y="115" fill="#7f8c8d" font-size="10">Resp: "[OK] LED turned ON
"</text>

    <!-- Command 2 -->
    <rect x="320" y="50" width="260" height="85" rx="6" fill="#ffffff" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="335" y="75" fill="#c0392b" font-size="13" font-weight="bold">"LED OFF"</text>
    <text x="335" y="95" fill="#2c3e50" font-size="11">PC13 = SET (Active-LOW)</text>
    <text x="335" y="115" fill="#7f8c8d" font-size="10">Resp: "[OK] LED turned OFF
"</text>

    <!-- Command 3 -->
    <rect x="610" y="50" width="260" height="85" rx="6" fill="#ffffff" stroke="#f39c12" stroke-width="1.5"/>
    <text x="625" y="75" fill="#d35400" font-size="13" font-weight="bold">"LED TOGGLE"</text>
    <text x="625" y="95" fill="#2c3e50" font-size="11">HAL_GPIO_TogglePin(PC13)</text>
    <text x="625" y="115" fill="#7f8c8d" font-size="10">Resp: "[OK] LED toggled
"</text>

    <!-- Command 4 & Default -->
    <rect x="30" y="150" width="410" height="75" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5"/>
    <text x="45" y="175" fill="#8e44ad" font-size="13" font-weight="bold">"STATUS"</text>
    <text x="45" y="195" fill="#2c3e50" font-size="11">Queries PC13 output register</text>
    <text x="45" y="212" fill="#7f8c8d" font-size="10">Resp: "[STATUS] LED is currently ON/OFF
"</text>

    <rect x="460" y="150" width="410" height="75" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
    <text x="475" y="175" fill="#7f8c8d" font-size="13" font-weight="bold">UNRECOGNIZED INPUT</text>
    <text x="475" y="195" fill="#e74c3c" font-size="11">Invalid command syntax</text>
    <text x="475" y="212" fill="#7f8c8d" font-size="10">Resp: "[ERR] Unknown command: '...' Type HELP
"</text>
  </g>
</svg>