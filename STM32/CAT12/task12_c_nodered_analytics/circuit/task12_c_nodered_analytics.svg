<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="10" y="10" width="980" height="580" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <rect x="10" y="10" width="980" height="45" rx="8" fill="#1b2a4a"/>
  <text x="25" y="38" fill="#ffffff" font-size="18" font-weight="bold">Task 12C: Node-RED Environmental Statistical Analytics Flow</text>
  <text x="820" y="38" fill="#00d2d3" font-size="13" font-weight="bold">flow.json Export</text>

  <!-- Flow Canvas -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="900" height="470" rx="8" fill="#2d3436" stroke="#636e72" stroke-width="2"/>
    <text x="25" y="35" fill="#dfe6e9" font-size="15" font-weight="bold">Node-RED Flow: BME280 JSON Polling &amp; Statistical Analytics</text>

    <!-- Node 1: Inject -->
    <g transform="translate(30, 80)">
      <rect x="0" y="0" width="140" height="55" rx="6" fill="#0984e3"/>
      <text x="20" y="32" fill="#ffffff" font-size="12" font-weight="bold">Poll (5s)</text>
    </g>

    <!-- Wire 1 -->
    <line x1="170" y1="107" x2="220" y2="107" stroke="#fdcb6e" stroke-width="3"/>

    <!-- Node 2: HTTP Request -->
    <g transform="translate(220, 80)">
      <rect x="0" y="0" width="180" height="55" rx="6" fill="#e17055"/>
      <text x="15" y="25" fill="#ffffff" font-size="11" font-weight="bold">http request</text>
      <text x="15" y="42" fill="#ffeaa7" font-size="9">GET http://&lt;IP&gt;/data</text>
    </g>

    <!-- Wire 2 -->
    <line x1="400" y1="107" x2="450" y2="107" stroke="#fdcb6e" stroke-width="3"/>

    <!-- Node 3: JSON Parser -->
    <g transform="translate(450, 80)">
      <rect x="0" y="0" width="140" height="55" rx="6" fill="#00b894"/>
      <text x="20" y="32" fill="#ffffff" font-size="12" font-weight="bold">json parser</text>
    </g>

    <!-- Wire 3 -->
    <line x1="590" y1="107" x2="640" y2="107" stroke="#fdcb6e" stroke-width="3"/>

    <!-- Node 4: Analytics Function -->
    <g transform="translate(640, 80)">
      <rect x="0" y="0" width="220" height="55" rx="6" fill="#fdcb6e"/>
      <text x="20" y="25" fill="#2d3436" font-size="11" font-weight="bold">function: Statistics</text>
      <text x="20" y="42" fill="#2d3436" font-size="9">Computes Min, Max, Mean</text>
    </g>

    <!-- Output Dashboard Widgets below -->
    <g transform="translate(30, 180)">
      <!-- Temp Gauge -->
      <rect x="0" y="0" width="260" height="120" rx="6" fill="#1e272e" stroke="#e17055" stroke-width="1.5"/>
      <text x="20" y="30" fill="#e17055" font-size="12" font-weight="bold">TEMPERATURE (°C)</text>
      <text x="20" y="65" fill="#ffffff" font-size="22" font-weight="bold">28.45 °C</text>
      <text x="20" y="95" fill="#a4b0be" font-size="10">Min: 27.80 | Max: 29.10 | Avg: 28.32</text>

      <!-- Humidity Gauge -->
      <rect x="290" y="0" width="260" height="120" rx="6" fill="#1e272e" stroke="#0984e3" stroke-width="1.5"/>
      <text x="310" y="30" fill="#0984e3" font-size="12" font-weight="bold">HUMIDITY (%RH)</text>
      <text x="310" y="65" fill="#ffffff" font-size="22" font-weight="bold">62.30 %</text>
      <text x="310" y="95" fill="#a4b0be" font-size="10">Min: 58.40 | Max: 65.20 | Avg: 61.95</text>

      <!-- Pressure Gauge -->
      <rect x="580" y="0" width="260" height="120" rx="6" fill="#1e272e" stroke="#00b894" stroke-width="1.5"/>
      <text x="600" y="30" fill="#00b894" font-size="12" font-weight="bold">PRESSURE (hPa)</text>
      <text x="600" y="65" fill="#ffffff" font-size="22" font-weight="bold">1008.72 hPa</text>
      <text x="600" y="95" fill="#a4b0be" font-size="10">Min: 1007.5 | Max: 1009.8 | Avg: 1008.4</text>
    </g>

    <!-- Code explanation box -->
    <rect x="30" y="330" width="840" height="110" rx="6" fill="#1e272e" stroke="#57606f" stroke-width="1"/>
    <text x="50" y="360" fill="#00d2d3" font-size="12" font-weight="bold">STATISTICAL ENGINE SCRIPT (context.get("stats")):</text>
    <text x="50" y="385" fill="#dfe6e9" font-family="monospace" font-size="10">stats.min = Math.min(stats.min, val); stats.max = Math.max(stats.max, val);</text>
    <text x="50" y="405" fill="#dfe6e9" font-family="monospace" font-size="10">stats.sum += val; stats.count++; stats.avg = stats.sum / stats.count;</text>
  </g>
</svg>