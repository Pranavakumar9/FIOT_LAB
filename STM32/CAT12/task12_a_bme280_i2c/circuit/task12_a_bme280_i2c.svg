<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="10" y="10" width="980" height="580" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <rect x="10" y="10" width="980" height="45" rx="8" fill="#1b2a4a"/>
  <text x="25" y="38" fill="#ffffff" font-size="18" font-weight="bold">Task 12A: Bosch Sensortec BME280 I2C API Integration</text>
  <text x="820" y="38" fill="#00d2d3" font-size="13" font-weight="bold">I2C1 @ 100 kHz</text>

  <!-- Bosch Architecture -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="900" height="250" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/>
    <text x="25" y="28" fill="#2980b9" font-size="14" font-weight="bold">BOSCH SENSOR API (v3.x) ARCHITECTURE &amp; HARDWARE WRAPPERS</text>

    <!-- Block 1: Bosch API Core -->
    <rect x="30" y="55" width="260" height="150" rx="6" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="45" y="80" fill="#2c3e50" font-size="12" font-weight="bold">Bosch Sensor API (bme280.c)</text>
    <text x="45" y="105" fill="#7f8c8d" font-size="10">• bme280_init(&amp;dev)</text>
    <text x="45" y="125" fill="#7f8c8d" font-size="10">• bme280_set_sensor_settings()</text>
    <text x="45" y="145" fill="#7f8c8d" font-size="10">• bme280_set_sensor_mode()</text>
    <text x="45" y="165" fill="#7f8c8d" font-size="10">• bme280_get_sensor_data()</text>
    <text x="45" y="185" fill="#27ae60" font-size="10" font-weight="bold">Compensation Math (Fixed-pt)</text>

    <!-- Arrow to Wrappers -->
    <line x1="290" y1="130" x2="330" y2="130" stroke="#2980b9" stroke-width="2"/>

    <!-- Block 2: User Wrappers -->
    <rect x="330" y="55" width="270" height="150" rx="6" fill="#ffffff" stroke="#f39c12" stroke-width="1.5"/>
    <text x="345" y="80" fill="#d35400" font-size="12" font-weight="bold">User Hardware Callbacks</text>
    <text x="345" y="105" fill="#2c3e50" font-size="10">• user_i2c_read(reg, data, len)</text>
    <text x="345" y="125" fill="#7f8c8d" font-size="9">  calls HAL_I2C_Mem_Read()</text>
    <text x="345" y="145" fill="#2c3e50" font-size="10">• user_i2c_write(reg, data, len)</text>
    <text x="345" y="165" fill="#7f8c8d" font-size="9">  calls HAL_I2C_Mem_Write()</text>
    <text x="345" y="185" fill="#2c3e50" font-size="10">• user_delay_ms() -&gt; HAL_Delay()</text>

    <!-- Arrow to HAL -->
    <line x1="600" y1="130" x2="640" y2="130" stroke="#2980b9" stroke-width="2"/>

    <!-- Block 3: Physical I2C Hardware -->
    <rect x="640" y="55" width="230" height="150" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
    <text x="655" y="80" fill="#27ae60" font-size="12" font-weight="bold">STM32 I2C1 Peripheral</text>
    <text x="655" y="105" fill="#2c3e50" font-size="10">• PB6 (SCL) Clock line</text>
    <text x="655" y="125" fill="#2c3e50" font-size="10">• PB7 (SDA) Data line</text>
    <text x="655" y="145" fill="#2c3e50" font-size="10">• 7-bit Address: 0x76</text>
    <text x="655" y="165" fill="#27ae60" font-size="10" font-weight="bold">• Chip ID: 0x60 (Reg 0xD0)</text>
    <text x="655" y="185" fill="#7f8c8d" font-size="10">Standard Mode (100 kHz)</text>
  </g>

  <!-- Terminal Output Representation -->
  <g transform="translate(50, 350)">
    <rect x="0" y="0" width="900" height="200" rx="6" fill="#1c2833" stroke="#34495e" stroke-width="2"/>
    <text x="25" y="30" fill="#00d2d3" font-size="13" font-weight="bold">LIVE TELEMETRY LOG (USART2 @ 115200)</text>
    <text x="25" y="65" fill="#2ecc71" font-family="monospace" font-size="12">[BME280] Chip ID verified: 0x60 (Device Connected Successfully)</text>
    <text x="25" y="90" fill="#ecf0f1" font-family="monospace" font-size="11">Sampling @ 1 Hz (Normal Mode, Standby: 1000 ms, Filter: Coeff 4):</text>
    <text x="25" y="115" fill="#f1c40f" font-family="monospace" font-size="11">Temperature: 28.45 °C  |  Pressure: 1008.72 hPa  |  Humidity: 62.30 %RH</text>
    <text x="25" y="140" fill="#f1c40f" font-family="monospace" font-size="11">Temperature: 28.46 °C  |  Pressure: 1008.75 hPa  |  Humidity: 62.28 %RH</text>
    <text x="25" y="165" fill="#f1c40f" font-family="monospace" font-size="11">Temperature: 28.44 °C  |  Pressure: 1008.71 hPa  |  Humidity: 62.32 %RH</text>
  </g>
</svg>