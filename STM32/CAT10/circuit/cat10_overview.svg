<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 780" width="1150" height="780" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="10" y="10" width="1130" height="760" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <rect x="10" y="10" width="1130" height="48" rx="8" fill="#1b2a4a"/>
  <text x="30" y="38" fill="#ffffff" font-size="20" font-weight="bold">STM32F103 &amp; Wemos D1 (ESP8266) Wi-Fi Modem &amp; Web Server</text>
  <text x="940" y="38" fill="#00d2d3" font-size="14" font-weight="bold">CAT10: Week 9/10 Lab</text>

  <!-- Legend -->
  <rect x="870" y="75" width="250" height="230" rx="6" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1.5"/>
  <text x="885" y="98" fill="#2c3e50" font-size="13" font-weight="bold">CIRCUIT PIN CONNECTIONS</text>
  <line x1="885" y1="104" x2="1105" y2="104" stroke="#bdc3c7" stroke-width="1"/>
  <circle cx="895" cy="122" r="5" fill="#f39c12"/>
  <text x="910" y="126" fill="#333" font-size="12">PA9: USART1_TX -&gt; Wemos RX</text>
  <circle cx="895" cy="144" r="5" fill="#27ae60"/>
  <text x="910" y="148" fill="#333" font-size="12">PA10: USART1_RX &lt;- Wemos TX</text>
  <circle cx="895" cy="166" r="5" fill="#2980b9"/>
  <text x="910" y="170" fill="#333" font-size="12">PA2: USART2_TX -&gt; PC RX</text>
  <circle cx="895" cy="188" r="5" fill="#8e44ad"/>
  <text x="910" y="192" fill="#333" font-size="12">PA3: USART2_RX &lt;- PC TX</text>
  <circle cx="895" cy="210" r="5" fill="#2c3e50"/>
  <text x="910" y="214" fill="#333" font-size="12">GND: Common Ground</text>
  <text x="885" y="244" fill="#7f8c8d" font-size="11" font-style="italic">Baud: 115200 (Default ESP)</text>
  <text x="885" y="260" fill="#7f8c8d" font-size="11" font-style="italic">Wemos Supply: 5V external</text>
  <text x="885" y="276" fill="#7f8c8d" font-size="11" font-style="italic">Peak current ~250 mA (Wi-Fi)</text>

  <!-- PC / Console (Far Left) -->
  <g transform="translate(40, 140)">
    <rect x="0" y="0" width="180" height="260" rx="8" fill="#2c3e50" stroke="#34495e" stroke-width="2"/>
    <text x="20" y="30" fill="#ffffff" font-size="13" font-weight="bold">Host PC Console</text>
    <rect x="15" y="45" width="150" height="150" fill="#000000" rx="4"/>
    <text x="25" y="70" fill="#00ff00" font-family="monospace" font-size="9">&gt; AT</text>
    <text x="25" y="85" fill="#ffffff" font-family="monospace" font-size="9">OK</text>
    <text x="25" y="100" fill="#00ff00" font-family="monospace" font-size="9">&gt; AT+CIFSR</text>
    <text x="25" y="115" fill="#00d2d3" font-family="monospace" font-size="9">192.168.1.105</text>
    <text x="20" y="225" fill="#bdc3c7" font-size="11">PuTTY @ 115200</text>
    <text x="20" y="245" fill="#bdc3c7" font-size="11">Via USB-to-TTL</text>
  </g>

  <!-- STM32 Blue Pill Board (Center Left) -->
  <g transform="translate(280, 100)">
    <rect x="0" y="0" width="260" height="600" rx="8" fill="#0f2b46" stroke="#1abc9c" stroke-width="2.5"/>
    <text x="45" y="35" fill="#1abc9c" font-size="18" font-weight="bold">STM32F103C8T6</text>
    <text x="50" y="58" fill="#bdc3c7" font-size="12">Core @ 72 MHz</text>

    <!-- USART2 Port (To PC) -->
    <rect x="15" y="90" width="230" height="110" rx="6" fill="#1c2833" stroke="#2980b9" stroke-width="1.5"/>
    <text x="25" y="115" fill="#2980b9" font-size="12" font-weight="bold">USART2 (PC Console Bridge)</text>
    <circle cx="35" cy="140" r="5" fill="#2980b9"/>
    <text x="50" y="144" fill="#ecf0f1" font-size="11">PA2 (TX2) -&gt; PC RX</text>
    <circle cx="35" cy="170" r="5" fill="#8e44ad"/>
    <text x="50" y="174" fill="#ecf0f1" font-size="11">PA3 (RX2) &lt;- PC TX</text>

    <!-- USART1 Port (To ESP8266) -->
    <rect x="15" y="230" width="230" height="110" rx="6" fill="#1c2833" stroke="#f39c12" stroke-width="1.5"/>
    <text x="25" y="255" fill="#f39c12" font-size="12" font-weight="bold">USART1 (Wemos AT Modem)</text>
    <circle cx="35" cy="280" r="5" fill="#f39c12"/>
    <text x="50" y="284" fill="#ecf0f1" font-size="11">PA9 (TX1) -&gt; Wemos RX</text>
    <circle cx="35" cy="310" r="5" fill="#27ae60"/>
    <text x="50" y="314" fill="#ecf0f1" font-size="11">PA10 (RX1) &lt;- Wemos TX</text>

    <!-- Power and LED -->
    <circle cx="35" cy="380" r="5" fill="#2c3e50"/>
    <text x="50" y="384" fill="#ecf0f1" font-size="11">GND (Common Ground)</text>
    <circle cx="35" cy="410" r="5" fill="#00d2d3"/>
    <text x="50" y="414" fill="#00d2d3" font-size="11">PC13 (User LED)</text>
  </g>

  <!-- Wemos D1 Mini / ESP8266 (Center Right) -->
  <g transform="translate(600, 140)">
    <rect x="0" y="0" width="230" height="420" rx="8" fill="#1e3799" stroke="#4a69bd" stroke-width="2.5"/>
    <text x="30" y="35" fill="#ffffff" font-size="16" font-weight="bold">Wemos D1 Mini</text>
    <text x="55" y="55" fill="#82ccdd" font-size="12">ESP8266 Wi-Fi</text>

    <!-- Antenna representation -->
    <rect x="40" y="70" width="150" height="50" rx="4" fill="#0a3d62" stroke="#60a3bc" stroke-width="1.5"/>
    <text x="70" y="100" fill="#f8c291" font-size="11" font-weight="bold">PCB Antenna</text>

    <!-- Wemos Pins -->
    <circle cx="25" cy="160" r="5" fill="#f39c12"/>
    <text x="40" y="164" fill="#ffffff" font-size="12">RX (GPIO3)</text>

    <circle cx="25" cy="200" r="5" fill="#27ae60"/>
    <text x="40" y="204" fill="#ffffff" font-size="12">TX (GPIO1)</text>

    <circle cx="25" cy="240" r="5" fill="#2c3e50"/>
    <text x="40" y="244" fill="#ffffff" font-size="12">GND</text>

    <circle cx="25" cy="280" r="5" fill="#e74c3c"/>
    <text x="40" y="284" fill="#ffffff" font-size="12">5V (VCC In)</text>

    <rect x="25" y="320" width="180" height="70" rx="4" fill="#0c2461"/>
    <text x="35" y="345" fill="#82ccdd" font-size="11">Mode: Station + Server</text>
    <text x="35" y="365" fill="#82ccdd" font-size="11">IP: 192.168.1.105:80</text>
  </g>

  <!-- Wires: STM32 <-> Wemos -->
  <!-- PA9 TX1 -> Wemos RX -->
  <line x1="510" y1="380" x2="600" y2="300" stroke="#f39c12" stroke-width="2.5"/>
  <!-- PA10 RX1 <- Wemos TX -->
  <line x1="600" y1="340" x2="510" y2="410" stroke="#27ae60" stroke-width="2.5"/>
  <!-- GND -->
  <line x1="510" y1="480" x2="600" y2="380" stroke="#2c3e50" stroke-width="2"/>

  <!-- Wi-Fi Waves to Router -->
  <g transform="translate(860, 400)">
    <rect x="0" y="0" width="240" height="160" rx="6" fill="#f4f6f7" stroke="#7f8c8d" stroke-width="1.5"/>
    <text x="25" y="30" fill="#2c3e50" font-size="13" font-weight="bold">Wi-Fi Access Point / Router</text>
    <text x="25" y="55" fill="#7f8c8d" font-size="11">SSID: "SNU_IoT_Lab"</text>
    <text x="25" y="75" fill="#7f8c8d" font-size="11">Security: WPA2-PSK</text>
    <text x="25" y="105" fill="#27ae60" font-size="12" font-weight="bold">Station Connected (DHCP)</text>
    <text x="25" y="130" fill="#2980b9" font-size="11">Node-RED / Browser Client</text>
  </g>

  <!-- Wi-Fi Radiation symbol -->
  <path d="M 800 200 A 40 40 0 0 1 840 240" fill="none" stroke="#3498db" stroke-width="3"/>
  <path d="M 810 190 A 60 60 0 0 1 870 250" fill="none" stroke="#3498db" stroke-width="3"/>
  <path d="M 820 180 A 80 80 0 0 1 900 260" fill="none" stroke="#3498db" stroke-width="3"/>
</svg>