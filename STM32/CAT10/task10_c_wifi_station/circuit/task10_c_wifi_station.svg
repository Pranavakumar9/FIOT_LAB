<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="10" y="10" width="980" height="580" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <rect x="10" y="10" width="980" height="45" rx="8" fill="#1b2a4a"/>
  <text x="25" y="38" fill="#ffffff" font-size="18" font-weight="bold">Task 10C: Wi-Fi Station Association &amp; DHCP IP Acquisition</text>
  <text x="820" y="38" fill="#00d2d3" font-size="13" font-weight="bold">STM32 + ESP8266</text>

  <!-- Network Topology -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="880" height="200" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/>
    <text x="20" y="30" fill="#2980b9" font-size="14" font-weight="bold">AUTOMATED WI-FI PROVISIONING PIPELINE</text>

    <!-- Box 1 -->
    <rect x="30" y="60" width="170" height="100" rx="4" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="40" y="85" fill="#2c3e50" font-size="12" font-weight="bold">1. Mode Setting</text>
    <text x="40" y="105" fill="#2980b9" font-family="monospace" font-size="10">AT+CWMODE=1</text>
    <text x="40" y="125" fill="#7f8c8d" font-size="10">Station mode (STA)</text>
    <text x="40" y="145" fill="#27ae60" font-size="10">&lt;- OK</text>

    <line x1="200" y1="110" x2="250" y2="110" stroke="#2c3e50" stroke-width="2"/>

    <!-- Box 2 -->
    <rect x="250" y="60" width="180" height="100" rx="4" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="260" y="85" fill="#2c3e50" font-size="12" font-weight="bold">2. Network Join</text>
    <text x="260" y="105" fill="#2980b9" font-family="monospace" font-size="10">AT+CWJAP="..."</text>
    <text x="260" y="125" fill="#7f8c8d" font-size="10">SSID + Password</text>
    <text x="260" y="145" fill="#27ae60" font-size="10">&lt;- WIFI CONNECTED</text>

    <line x1="430" y1="110" x2="480" y2="110" stroke="#2c3e50" stroke-width="2"/>

    <!-- Box 3 -->
    <rect x="480" y="60" width="180" height="100" rx="4" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="490" y="85" fill="#2c3e50" font-size="12" font-weight="bold">3. DHCP Lease</text>
    <text x="490" y="105" fill="#2980b9" font-family="monospace" font-size="10">&lt;- WIFI GOT IP</text>
    <text x="490" y="125" fill="#7f8c8d" font-size="10">DHCP Negotiation</text>
    <text x="490" y="145" fill="#27ae60" font-size="10">&lt;- OK</text>

    <line x1="660" y1="110" x2="710" y2="110" stroke="#2c3e50" stroke-width="2"/>

    <!-- Box 4 -->
    <rect x="710" y="60" width="140" height="100" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
    <text x="720" y="85" fill="#27ae60" font-size="12" font-weight="bold">4. Query IP</text>
    <text x="720" y="105" fill="#2980b9" font-family="monospace" font-size="10">AT+CIFSR</text>
    <text x="720" y="125" fill="#7f8c8d" font-size="10">STAIP Acquired</text>
    <text x="720" y="145" fill="#27ae60" font-size="10">192.168.1.105</text>
  </g>

  <!-- Serial Log Visualization -->
  <g transform="translate(60, 320)">
    <rect x="0" y="0" width="880" height="230" rx="6" fill="#1c2833" stroke="#34495e" stroke-width="2"/>
    <text x="25" y="30" fill="#00d2d3" font-size="13" font-weight="bold">CAPTURED STM32 USART1 MODEM TRAFFIC LOG</text>
    <text x="25" y="60" fill="#f39c12" font-family="monospace" font-size="11">&gt;&gt; [STM32-&gt;WEMOS] AT+CWMODE=1
</text>
    <text x="25" y="80" fill="#2ecc71" font-family="monospace" font-size="11">&lt;&lt; [WEMOS-&gt;STM32] AT+CWMODE=1

OK
</text>
    <text x="25" y="105" fill="#f39c12" font-family="monospace" font-size="11">&gt;&gt; [STM32-&gt;WEMOS] AT+CWJAP="Campus_IoT","SecurePass123"
</text>
    <text x="25" y="125" fill="#2ecc71" font-family="monospace" font-size="11">&lt;&lt; [WEMOS-&gt;STM32] WIFI CONNECTED
</text>
    <text x="25" y="145" fill="#2ecc71" font-family="monospace" font-size="11">&lt;&lt; [WEMOS-&gt;STM32] WIFI GOT IP

OK
</text>
    <text x="25" y="170" fill="#f39c12" font-family="monospace" font-size="11">&gt;&gt; [STM32-&gt;WEMOS] AT+CIFSR
</text>
    <text x="25" y="190" fill="#00d2d3" font-family="monospace" font-size="11">&lt;&lt; [WEMOS-&gt;STM32] +CIFSR:STAIP,"192.168.1.105"
+CIFSR:STAMAC,"5c:cf:7f:8a:2b:11"

OK
</text>
    <text x="25" y="215" fill="#ecf0f1" font-size="10">Station successfully associated. Ready for TCP Socket / HTTP Web Server creation.</text>
  </g>
</svg>