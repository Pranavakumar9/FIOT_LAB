<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="10" y="10" width="980" height="600" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <rect x="10" y="10" width="980" height="45" rx="8" fill="#1b2a4a"/>
  <text x="25" y="38" fill="#ffffff" font-size="18" font-weight="bold">Task 11.3: Short-Press vs Long-Press Duration Detection</text>
  <text x="820" y="38" fill="#00d2d3" font-size="13" font-weight="bold">NUCLEO-F401RE</text>

  <!-- Timeline 1: Short Press -->
  <g transform="translate(50, 80)">
    <rect x="0" y="0" width="900" height="220" rx="6" fill="#f8f9fa" stroke="#2980b9" stroke-width="1.5"/>
    <text x="25" y="28" fill="#2980b9" font-size="14" font-weight="bold">CASE 1: SHORT PRESS (&lt; 1000 ms) -&gt; TOGGLE LD2 (PA5) ONCE</text>
    
    <text x="40" y="70" fill="#2c3e50" font-size="11" font-weight="bold">B1 Button (PC13):</text>
    <path d="M 160 70 L 240 70 L 240 110 L 440 110 L 440 70 L 800 70" fill="none" stroke="#2980b9" stroke-width="2.5"/>
    
    <text x="240" y="135" fill="#2980b9" font-size="10">Press Start (t0)</text>
    <text x="430" y="135" fill="#2980b9" font-size="10">Release (t1)</text>

    <line x1="240" y1="150" x2="440" y2="150" stroke="#e67e22" stroke-width="1.5"/>
    <text x="270" y="170" fill="#e67e22" font-size="12" font-weight="bold">Duration: 300 ms (&lt; 1000 ms)</text>

    <text x="40" y="200" fill="#27ae60" font-size="11" font-weight="bold">LD2 (PA5 Action):</text>
    <text x="180" y="200" fill="#27ae60" font-size="12" font-weight="bold">Toggles state immediately upon release. (If blinking, halts blinking).</text>
  </g>

  <!-- Timeline 2: Long Press -->
  <g transform="translate(50, 330)">
    <rect x="0" y="0" width="900" height="260" rx="6" fill="#f8f9fa" stroke="#e74c3c" stroke-width="1.5"/>
    <text x="25" y="28" fill="#c0392b" font-size="14" font-weight="bold">CASE 2: LONG PRESS (&gt;= 1000 ms) -&gt; CONTINUOUS 500 ms BLINKING MODE</text>
    
    <text x="40" y="70" fill="#2c3e50" font-size="11" font-weight="bold">B1 Button (PC13):</text>
    <path d="M 160 70 L 240 70 L 240 110 L 700 110 L 700 70 L 850 70" fill="none" stroke="#c0392b" stroke-width="2.5"/>
    
    <text x="240" y="135" fill="#c0392b" font-size="10">Press Start (t0)</text>
    <text x="690" y="135" fill="#c0392b" font-size="10">Release (t1)</text>

    <line x1="240" y1="150" x2="700" y2="150" stroke="#c0392b" stroke-width="1.5"/>
    <text x="400" y="170" fill="#c0392b" font-size="12" font-weight="bold">Duration: 1600 ms (&gt;= 1000 ms)</text>

    <!-- LD2 action: Blinking -->
    <text x="40" y="210" fill="#27ae60" font-size="11" font-weight="bold">LD2 (PA5 Blink):</text>
    <path d="M 240 230 L 320 230 L 320 200 L 400 200 L 400 230 L 480 230 L 480 200 L 560 200 L 560 230 L 640 230 L 640 200 L 720 200 L 720 230 L 800 230" fill="none" stroke="#27ae60" stroke-width="2.5"/>
    <text x="810" y="220" fill="#27ae60" font-size="11" font-weight="bold">500 ms Cadence</text>
    <text x="240" y="250" fill="#7f8c8d" font-size="10">Subsequent short press stops blinking; subsequent long press restarts blinking.</text>
  </g>
</svg>