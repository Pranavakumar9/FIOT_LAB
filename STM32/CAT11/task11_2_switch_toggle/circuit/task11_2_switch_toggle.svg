<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="10" y="10" width="980" height="580" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <rect x="10" y="10" width="980" height="45" rx="8" fill="#1b2a4a"/>
  <text x="25" y="38" fill="#ffffff" font-size="18" font-weight="bold">Task 11.2: B1 (PC13) Button Toggle with State Remembrance</text>
  <text x="820" y="38" fill="#00d2d3" font-size="13" font-weight="bold">NUCLEO-F401RE</text>

  <!-- B1 Button Circuit -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="400" height="260" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/>
    <text x="25" y="30" fill="#2980b9" font-size="14" font-weight="bold">B1 (PC13) BLUE BUTTON SCHEMATIC</text>

    <!-- 3.3V Pull-Up -->
    <line x1="120" y1="60" x2="120" y2="90" stroke="#e74c3c" stroke-width="2"/>
    <text x="110" y="55" fill="#e74c3c" font-size="11" font-weight="bold">3.3V</text>
    <rect x="112" y="90" width="16" height="40" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="75" y="115" fill="#2c3e50" font-size="10">R26 (4.7k)</text>

    <line x1="120" y1="130" x2="120" y2="180" stroke="#2980b9" stroke-width="2"/>
    <line x1="120" y1="180" x2="280" y2="180" stroke="#2980b9" stroke-width="2"/>
    <text x="210" y="170" fill="#2980b9" font-size="11" font-weight="bold">To PC13</text>

    <!-- Push button switch to GND -->
    <line x1="120" y1="180" x2="120" y2="210" stroke="#2c3e50" stroke-width="2"/>
    <circle cx="120" cy="210" r="4" fill="#2c3e50"/>
    <line x1="120" y1="210" x2="140" y2="225" stroke="#2c3e50" stroke-width="2.5"/>
    <circle cx="120" cy="240" r="4" fill="#2c3e50"/>
    <line x1="120" y1="240" x2="120" y2="250" stroke="#2c3e50" stroke-width="2"/>
    <text x="140" y="255" fill="#2c3e50" font-size="11" font-weight="bold">GND</text>

    <!-- Filtering Cap C15 -->
    <line x1="160" y1="180" x2="160" y2="220" stroke="#7f8c8d" stroke-width="1.5"/>
    <line x1="150" y1="220" x2="170" y2="220" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="150" y1="225" x2="170" y2="225" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="160" y1="225" x2="160" y2="250" stroke="#7f8c8d" stroke-width="1.5"/>
    <text x="175" y="235" fill="#7f8c8d" font-size="10">C15 (100nF)</text>
  </g>

  <!-- State Remembrance Timing (Right) -->
  <g transform="translate(500, 100)">
    <rect x="0" y="0" width="440" height="260" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
    <text x="25" y="30" fill="#d35400" font-size="14" font-weight="bold">STATE REMEMBRANCE ACROSS RELEASE</text>

    <!-- Button signal -->
    <text x="30" y="70" fill="#2980b9" font-size="11" font-weight="bold">B1 (PC13):</text>
    <path d="M 110 65 L 170 65 L 170 95 L 230 95 L 230 65 L 310 65 L 310 95 L 370 95 L 370 65 L 410 65" fill="none" stroke="#2980b9" stroke-width="2"/>
    <text x="175" y="110" fill="#2980b9" font-size="10">Press 1</text>
    <text x="315" y="110" fill="#2980b9" font-size="10">Press 2</text>

    <!-- LED signal -->
    <text x="30" y="160" fill="#27ae60" font-size="11" font-weight="bold">LD2 (PA5):</text>
    <path d="M 110 170 L 230 170 L 230 135 L 370 135 L 370 170 L 410 170" fill="none" stroke="#27ae60" stroke-width="3"/>
    <text x="140" y="185" fill="#7f8c8d" font-size="10">OFF (0V)</text>
    <text x="250" y="130" fill="#27ae60" font-size="10" font-weight="bold">ON (State Retained)</text>
    <text x="380" y="185" fill="#7f8c8d" font-size="10">OFF</text>

    <text x="30" y="220" fill="#2c3e50" font-size="11">• LED state changes ONCE when button is released.</text>
    <text x="30" y="240" fill="#2c3e50" font-size="11">• Releasing button retains the new state indefinitely.</text>
  </g>

  <!-- State Machine Description -->
  <g transform="translate(60, 390)">
    <rect x="0" y="0" width="880" height="160" rx="6" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1.5"/>
    <text x="20" y="25" fill="#2c3e50" font-size="13" font-weight="bold">DEBOUNCE LOGIC ON NUCLEO-F401RE</text>
    <text x="30" y="55" fill="#2c3e50" font-size="11">Although the Nucleo board includes hardware capacitor C15 (100nF), a software debounce window (30 ms)</text>
    <text x="30" y="75" fill="#2c3e50" font-size="11">is enforced via HAL_GetTick() to ensure 100% immunity to mechanical micro-vibrations.</text>
    <text x="30" y="105" fill="#27ae60" font-size="11" font-weight="bold">State Preservation Guarantee: The boolean flag 'led_state' is preserved in static memory, so the LED</text>
    <text x="30" y="125" fill="#27ae60" font-size="11" font-weight="bold">remains strictly in its toggled condition after the finger lifts off the blue button.</text>
  </g>
</svg>