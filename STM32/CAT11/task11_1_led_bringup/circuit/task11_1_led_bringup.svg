<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="1000" height="600" style="background:#ffffff; font-family:'Segoe UI', Arial, sans-serif;">
  <rect x="10" y="10" width="980" height="580" rx="8" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <rect x="10" y="10" width="980" height="45" rx="8" fill="#1b2a4a"/>
  <text x="25" y="38" fill="#ffffff" font-size="18" font-weight="bold">Task 11.1: NUCLEO-F401RE LD2 (PA5) 500 ms Periodic Blink</text>
  <text x="820" y="38" fill="#00d2d3" font-size="13" font-weight="bold">ARM Cortex-M4</text>

  <!-- Circuit Schematic (Left) -->
  <g transform="translate(60, 100)">
    <rect x="0" y="0" width="400" height="280" rx="6" fill="#f8f9fa" stroke="#27ae60" stroke-width="1.5"/>
    <text x="25" y="30" fill="#27ae60" font-size="14" font-weight="bold">LD2 USER LED ELECTRICAL CIRCUIT</text>
    
    <!-- MCU Output Pin -->
    <rect x="40" y="80" width="120" height="50" rx="4" fill="#1c2833"/>
    <text x="50" y="110" fill="#ecf0f1" font-size="12" font-weight="bold">STM32 PA5</text>

    <line x1="160" y1="105" x2="220" y2="105" stroke="#27ae60" stroke-width="2.5"/>

    <!-- Resistor 330R -->
    <rect x="220" y="97" width="50" height="16" fill="#ffffff" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="230" y="110" fill="#2c3e50" font-size="10">330R</text>

    <line x1="270" y1="105" x2="310" y2="105" stroke="#27ae60" stroke-width="2.5"/>

    <!-- Green LED Anode to Pin -->
    <polygon points="310,95 310,115 330,105" fill="#2ecc71"/>
    <line x1="330" y1="95" x2="330" y2="115" stroke="#2ecc71" stroke-width="2"/>

    <line x1="330" y1="105" x2="360" y2="105" stroke="#2c3e50" stroke-width="2"/>
    <line x1="360" y1="105" x2="360" y2="160" stroke="#2c3e50" stroke-width="2"/>
    <line x1="345" y1="160" x2="375" y2="160" stroke="#2c3e50" stroke-width="3"/>
    <text x="345" y="180" fill="#2c3e50" font-size="11" font-weight="bold">GND</text>

    <!-- Notes -->
    <text x="25" y="210" fill="#2c3e50" font-size="11" font-weight="bold">Active-HIGH Wiring Topology:</text>
    <text x="25" y="230" fill="#2c3e50" font-size="11">• PA5 = SET (3.3V) -&gt; Current flows to GND -&gt; LED ON</text>
    <text x="25" y="250" fill="#2c3e50" font-size="11">• PA5 = RESET (0V) -&gt; No voltage potential -&gt; LED OFF</text>
  </g>

  <!-- Blink Waveform (Right) -->
  <g transform="translate(500, 100)">
    <rect x="0" y="0" width="440" height="280" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/>
    <text x="25" y="30" fill="#2980b9" font-size="14" font-weight="bold">PERIODIC 500 ms TOGGLE WAVEFORM</text>
    
    <path d="M 40 120 L 100 120 L 100 70 L 180 70 L 180 120 L 260 120 L 260 70 L 340 70 L 340 120 L 400 120" fill="none" stroke="#27ae60" stroke-width="3"/>
    <text x="40" y="65" fill="#27ae60" font-size="11">HIGH (3.3V)</text>
    <text x="40" y="138" fill="#7f8c8d" font-size="11">LOW (0V)</text>

    <!-- Brackets -->
    <line x1="100" y1="155" x2="180" y2="155" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="115" y="175" fill="#2c3e50" font-size="11" font-weight="bold">500 ms (ON)</text>

    <line x1="180" y1="155" x2="260" y2="155" stroke="#2c3e50" stroke-width="1.5"/>
    <text x="195" y="175" fill="#2c3e50" font-size="11" font-weight="bold">500 ms (OFF)</text>

    <text x="25" y="220" fill="#2c3e50" font-size="11">• Frequency: 1.0 Hz (Period T = 1000 ms)</text>
    <text x="25" y="240" fill="#2c3e50" font-size="11">• Duty Cycle: 50%</text>
    <text x="25" y="260" fill="#2c3e50" font-size="11">• Driven via HAL_Delay(500) or non-blocking timer</text>
  </g>

  <!-- Flowchart below -->
  <g transform="translate(60, 420)">
    <rect x="0" y="0" width="880" height="130" rx="6" fill="#f8f9fa" stroke="#bdc3c7" stroke-width="1.5"/>
    <text x="20" y="25" fill="#2c3e50" font-size="13" font-weight="bold">EXECUTION TIMELINE &amp; REGISTER LEVEL GATING</text>
    <text x="30" y="60" fill="#2c3e50" font-size="11">1. Clock Enable: __HAL_RCC_GPIOA_CLK_ENABLE() activates APB clock to Port A.</text>
    <text x="30" y="85" fill="#2c3e50" font-size="11">2. Pin Configuration: PA5 configured as GPIO_MODE_OUTPUT_PP with GPIO_NOPULL.</text>
    <text x="30" y="110" fill="#27ae60" font-size="11" font-weight="bold">3. Superloop Action: HAL_GPIO_TogglePin(GPIOA, GPIO_PIN_5) inverts ODR bit 5 every 500 ms.</text>
  </g>
</svg>